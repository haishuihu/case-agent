services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: testcase_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/testcase_assistant
    ports:
      - "8000:8000"

volumes:
  postgres_data:
